services:
  - type: web
    name: skan-hunt-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python interface/app.py
    envVars:
      - key: SKAN_HOST
        value: 0.0.0.0
      - key: SKAN_TRUST_PROXY_HEADERS
        value: "1"
      - key: DATABASE_URL
        sync: false
      - key: SKAN_ADMIN_KEY
        generateValue: true
      - key: YOUTUBE_API_KEY
        sync: false
      - key: SKAN_ALLOWED_ORIGINS
        sync: false
